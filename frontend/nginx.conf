server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # FIX: ny VITE_API_URL=/api (.env.production) dia mila io location io mba
    # hampandeha ny request rehetra mankany amin'ny /api/* ho any amin'ny
    # backend Laravel. Tsy nisy izy io taloha, ka 404 daholo ny appel API
    # rehefa atao deploy amin'ity nginx ity ny frontend production build.
    # "backend" eto dia ny anaran'ilay service ao amin'ny docker-compose.yml
    # (jereo ny docker-compose.yml omena miaraka amin'ity).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}