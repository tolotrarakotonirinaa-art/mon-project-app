name: CI/CD Pipeline

on:
  push:
    branches:
      - staging

jobs:

  deploy-test:
    runs-on: [self-hosted, test-server]
    environment: staging
    steps:
      - name: Deployer sur TEST
        run: |
          cd /srv/test
          docker compose up -d
          echo "Application visible sur http://localhost:8080"

  validation-agent:
    needs: deploy-test
    runs-on: [self-hosted, test-server]
    environment:
      name: agent-approval
    steps:
      - name: Validation agent
        run: echo "Agent a valide"

  extract:
    needs: validation-agent
    runs-on: [self-hosted, test-server]
    steps:
      - name: Creer archive avy amin'ny TEST
        run: |
          mkdir -p /srv/test/archives
          tar -czf /srv/test/archives/projet.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            -C /srv/test/app \
            frontend backend
          ls -lh /srv/test/archives/
          echo "Archive vita"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projet-valide
          path: /srv/test/archives/projet.tar.gz
          retention-days: 7

  cleanup-test:
    needs: extract
    runs-on: [self-hosted, test-server]
    steps:
      - name: Retirer APK du TEST
        run: |
          rm -rf /srv/test/releases/*
          chmod 755 /srv/test/releases
          echo "APK retire du TEST"

  validation-chef:
    needs: cleanup-test
    runs-on: [self-hosted, test-server]
    environment:
      name: production-approval
    steps:
      - name: Validation chef
        run: echo "Chef a approuve"

  deploy-prod:
    needs: validation-chef
    runs-on: [self-hosted, prod-runner]
    steps:
      - name: Mandray archive
        uses: actions/download-artifact@v4
        with:
          name: projet-valide
          path: /tmp/

      - name: Deploy any PROD
        run: |
          mkdir -p /srv/prod/app/frontend
          mkdir -p /srv/prod/app/backend
          tar -xzf /tmp/projet.tar.gz -C /srv/prod/app/
          cd /srv/prod
          docker compose -f docker-compose.prod.yml down --remove-orphans
          docker compose -f docker-compose.prod.yml up -d --build
          echo "PROD deploye sur http://localhost:80"