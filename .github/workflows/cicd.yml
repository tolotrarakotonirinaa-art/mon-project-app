name: CI/CD Pipeline

on:
  push:
    branches:
      - staging

jobs:

  # ÉTAPE 1 — Déploiement automatique TEST
  deploy-test:
    runs-on: [self-hosted, test-server]
    steps:
      - name: Deploy code sur TEST
        run: |
          cd /srv/test/app
          git fetch origin
          git reset --hard origin/staging
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=test-database/g' /srv/test/app/backend/.env
          cd /srv/test
          docker compose up -d --build
          sleep 10
          docker ps
          echo "Application visible sur http://192.168.137.68:8080"

  # ÉTAPE 2 — Agent testeur valide dans le navigateur
  validation-agent:
    needs: deploy-test
    runs-on: [self-hosted, test-server]
    environment:
      name: agent-approval
    steps:
      - name: Validation agent testeur
        run: echo "Agent a approuve - application OK sur TEST"

  # ÉTAPE 3 — Extraction archive depuis TEST (le projet validé)
  extract:
    needs: validation-agent
    runs-on: [self-hosted, test-server]
    steps:
      - name: Creer archive depuis TEST
        run: |
          mkdir -p /srv/test/archives
          rm -f /srv/test/archives/projet.tar.gz
          tar -czf /srv/test/archives/projet.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            -C /srv/test/app \
            frontend backend database
          ls -lh /srv/test/archives/projet.tar.gz
          echo "Archive creee depuis TEST valide"

  # ÉTAPE 4 — APK retiré du TEST automatiquement
  cleanup-test:
    needs: extract
    runs-on: [self-hosted, test-server]
    steps:
      - name: Retirer APK du serveur TEST
        run: |
          cd /srv/test
          docker compose down --remove-orphans
          echo "TEST arrete - APK retire du serveur TEST"
          echo "Archive conservee dans /srv/test/archives/projet.tar.gz"

  # ÉTAPE 5 — Chef de projet autorise la mise en prod
  validation-chef:
    needs: cleanup-test
    runs-on: [self-hosted, test-server]
    environment:
      name: production-approval
    steps:
      - name: Validation chef de projet
        run: echo "Chef a approuve - deploiement PROD autorise"

  # ÉTAPE 6 — Déploiement PROD (accessible navigateur)
  deploy-prod:
    needs: validation-chef
    runs-on: [self-hosted, test-server]
    steps:
      - name: Envoyer archive vers PROD
        run: |
          scp /srv/test/archives/projet.tar.gz deployer@192.168.137.96:/srv/prod/
          echo "Archive envoyee vers PROD"

      - name: Deployer sur PROD
        run: |
          ssh deployer@192.168.137.96 "
            mkdir -p /srv/prod/app/frontend &&
            mkdir -p /srv/prod/app/backend &&
            mkdir -p /srv/prod/app/database &&
            tar -xzf /srv/prod/projet.tar.gz -C /srv/prod/app/ &&
            cd /srv/prod &&
            docker compose -f docker-compose.prod.yml down --remove-orphans &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            sleep 15 &&
            bash /srv/prod/deploy-post.sh &&
            docker ps &&
            echo 'PROD deploye - Client accede sur http://192.168.137.96:80'
          "