name: CI/CD Pipeline

on:
  push:
    branches:
      - staging

jobs:

  deploy-test:
    runs-on: [self-hosted, test-server]
    environment: staging
    steps:
      - name: Deployer sur TEST
        run: |
          cd /srv/test
          docker compose up -d
          sleep 5
          docker ps
          echo "Application visible sur http://localhost:8080"

      - name: Copier APK misy version automatique
        run: |
          chmod 755 /srv/test/releases
          VERSION=$(date +%Y%m%d-%H%M%S)
          COMMIT=${GITHUB_SHA::7}
          if ls $GITHUB_WORKSPACE/releases/*.apk 2>/dev/null; then
            for apk in $GITHUB_WORKSPACE/releases/*.apk; do
              if [ -f "$apk" ]; then
                BASENAME=$(basename "$apk" .apk)
                cp "$apk" "/srv/test/releases/${BASENAME}-${VERSION}-${COMMIT}.apk"
                echo "APK copie: ${BASENAME}-${VERSION}-${COMMIT}.apk"
              fi
            done
          else
            echo "Tsy misy APK vaovao ao amin ny releases/"
          fi
          ls -lh /srv/test/releases/
          echo "APK visible sur http://localhost:8080/releases/"

  validation-agent:
    needs: deploy-test
    runs-on: [self-hosted, test-server]
    environment:
      name: agent-approval
    steps:
      - name: Validation agent
        run: |
          echo "APK visible sur http://localhost:8080/releases/"
          ls -lh /srv/test/releases/

  validation-chef:
    needs: validation-agent
    runs-on: [self-hosted, test-server]
    environment:
      name: production-approval
    steps:
      - name: Validation chef
        run: echo "Chef a approuve"

  extract:
    needs: validation-chef
    runs-on: [self-hosted, test-server]
    steps:
      - name: Creer archive avy amin ny TEST
        run: |
          mkdir -p /srv/test/archives
          rm -f /srv/test/archives/projet.tar.gz
          tar -czf /srv/test/archives/projet.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            -C /srv/test/app \
            frontend backend
          ls -lh /srv/test/archives/projet.tar.gz
          echo "Archive vita"

  deploy-prod:
    needs: extract
    runs-on: [self-hosted, prod-runner]
    steps:
      - name: Deploy any PROD
        run: |
          echo "Reception archive avy amin ny TEST"
          ls -lh /srv/test/archives/projet.tar.gz
          mkdir -p /srv/prod/app/frontend
          mkdir -p /srv/prod/app/backend
          tar -xzf /srv/test/archives/projet.tar.gz -C /srv/prod/app/
          cd /srv/prod
          docker compose -f docker-compose.prod.yml down --remove-orphans
          docker compose -f docker-compose.prod.yml up -d --build
          sleep 10
          docker ps
          echo "PROD deploye sur http://localhost:80"

  cleanup-test:
    needs: deploy-prod
    runs-on: [self-hosted, test-server]
    steps:
      - name: Retirer APK du TEST
        run: |
          rm -rf /srv/test/releases/*
          chmod 755 /srv/test/releases
          echo "APK retire du TEST - disponible uniquement sur PROD"