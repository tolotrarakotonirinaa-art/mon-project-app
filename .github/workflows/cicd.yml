name: CI/CD Pipeline

on:
  push:
    branches:
      - staging

jobs:

  # ÉTAPE 1 — Déploiement automatique TEST
  deploy-test:
    runs-on: [self-hosted, test-server]
    steps:
      - name: Deploy code sur TEST
        run: |
          cd /srv/test/app
          git fetch origin
          git reset --hard origin/staging
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=test-database/g' /srv/test/app/backend/.env
          cd /srv/test
          docker compose up -d --build
          sleep 15
          echo "=== HEALTH CHECK ==="
          curl -f http://localhost:8080/api/health && echo "Backend OK" || echo "Backend FAILED"
          docker ps
          echo "========================================="
          echo "APPLICATION DISPONIBLE SUR TEST"
          echo "http://192.168.137.57:8080"
          echo "========================================="

  # ÉTAPE 2 — Agent teste l'application dans le navigateur
  validation-agent:
    needs: deploy-test
    runs-on: [self-hosted, test-server]
    environment:
      name: agent-approval
    steps:
      - name: En attente validation agent testeur
        run: |
          echo "========================================="
          echo "AGENT - Testez l application sur :"
          echo "http://192.168.137.57:8080"
          echo "-----------------------------------------"
          echo "Approuvez si OK"
          echo "Rejetez avec commentaire si probleme"
          echo "========================================="

  # ÉTAPE 3 — Chef de projet valide dans le navigateur
  validation-chef:
    needs: validation-agent
    runs-on: [self-hosted, test-server]
    environment:
      name: production-approval
    steps:
      - name: En attente validation chef de projet
        run: |
          echo "========================================="
          echo "CHEF - Verifiez l application sur :"
          echo "http://192.168.137.57:8080"
          echo "-----------------------------------------"
          echo "Approuvez pour deployer en PROD"
          echo "Rejetez avec commentaire si probleme"
          echo "========================================="

  # ÉTAPE 4 — Extraction archive depuis TEST validé
  extract:
    needs: validation-chef
    runs-on: [self-hosted, test-server]
    steps:
      - name: Creer archive depuis TEST valide
        run: |
          mkdir -p /srv/test/archives
          rm -f /srv/test/archives/projet.tar.gz
          tar -czf /srv/test/archives/projet.tar.gz \
            --exclude='.git' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            -C /srv/test/app \
            frontend backend database
          ls -lh /srv/test/archives/projet.tar.gz
          echo "Archive creee depuis TEST valide"

  # ÉTAPE 5 — APK retiré du TEST automatiquement
  cleanup-test:
    needs: extract
    runs-on: [self-hosted, test-server]
    steps:
      - name: Retirer APK du serveur TEST
        run: |
          cd /srv/test
          docker compose down --remove-orphans
          echo "TEST arrete - APK retire du serveur TEST"

  # ÉTAPE 6 — Déploiement PROD accessible navigateur
  deploy-prod:
    needs: cleanup-test
    runs-on: [self-hosted, test-server]
    steps:
      - name: Envoyer archive vers PROD
        run: |
          scp /srv/test/archives/projet.tar.gz deployer@192.168.137.144:/srv/prod/
          echo "Archive envoyee vers PROD"

      - name: Deployer sur PROD
        run: |
          ssh deployer@192.168.137.144 "
            mkdir -p /srv/prod/app/frontend &&
            mkdir -p /srv/prod/app/backend &&
            mkdir -p /srv/prod/app/database &&
            tar -xzf /srv/prod/projet.tar.gz -C /srv/prod/app/ &&
            cd /srv/prod &&
            docker compose -f docker-compose.prod.yml down --remove-orphans &&
            docker compose -f docker-compose.prod.yml up -d --build &&
            sleep 15 &&
            bash /srv/prod/deploy-post.sh &&
            docker ps &&
            echo 'PROD deploye - Client accede sur http://192.168.137.144:80'
          "